<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#95c989">
  <title>水果乱斗 · Boomerang Arena</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #95c989; touch-action: none; overscroll-behavior: none; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; color: #294533; font: 18px system-ui, sans-serif; background: #e6f3cd; }
    #loading h1 { margin: 0; font-size: 28px; }
    #loading p { margin: 0; font-size: 14px; }
    #progress { width: 230px; accent-color: #ef5263; }
    #error { max-width: 300px; line-height: 1.6; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="3D水果乱斗：设置人机、角色和计分方式后开始；WASD走动、J跳斩、K跳跃；按住L或手机投掷图标原地瞄准，用WASD或摇杆转向，松开投掷，停住后走近拾回；先到10分获胜"></canvas>
  <div id="loading">
    <h1>水果乱斗</h1>
    <p>正在准备食物角色和岩石庭院…</p>
    <progress id="progress"></progress>
    <p>选择击杀计分或存活加分 · 先到 10 分获胜</p>
    <p id="error" hidden></p>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    const progress = document.getElementById('progress');
    const canvas = document.getElementById('canvas');
    document.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
    window.addEventListener('contextmenu', event => event.preventDefault());
    engine.startGame({
      args: window.isSecureContext ? [] : ['--audio-driver', 'ScriptProcessor'],
      canvas,
      onProgress(current, total) { progress.value = current; progress.max = total || 1; },
    }).then(() => {
      document.getElementById('loading').remove();
      canvas.focus();
    }).catch(error => {
      const message = document.getElementById('error');
      message.hidden = false;
      message.textContent = '游戏加载失败，请尝试更新浏览器后重新打开。' + String(error);
      console.error(error);
    });
  </script>
</body>
</html>
